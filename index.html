<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <title>Accessible UI Form</title>
</head>
<body>
    <main class="form">
        <div class="fields">
            <div class="field">
                <label for="name-input">Full Name</label>
                <input aria-required="true" type="text" id="name-input" placeholder="What should we call you?" />
            </div>

            <div class="field">
                <label for="email-input">Email</label>
                <input aria-required="true" type="email" id="email-input" placeholder="john@doe.com" />
            </div>

            <div class="field">
                <label for="password-input">Password</label>
                <input aria-required="true" type="password" id="password-input" placeholder="xxxxxxxx" />
            </div>

            <div class="field">
                <label for="confirm-password-input">Confirm Password</label>
                <input aria-required="true" type="password" id="confirm-password-input" placeholder="xxxxxxxx" />
            </div>

            <button class="submit-btn" type="submit">Update Profile</button>
        </div>
        <div class="progress-panel">
            <div class="circle">
                <h2>65%</h2>
            </div>
            <h3>Profile Completeness</h3>
            <div class="todo-list">
                <ul>
                    <li class="strikethrough">Create Account</li>
                    <li class="strikethrough">Update Roadmap Progress</li>
                    <li class="strikethrough">Setup Public Profile</li>
                    <li>Complete your first project</li>
                    <li>Invite your Friends</li>
                </ul>
            </div>
        </div>
    </main>
</body>
</html>
